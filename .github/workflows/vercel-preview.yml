name: Vercel Preview Deployment

on:
  pull_request:
    branches:
      - "**"
  push:
    branches-ignore:
      - main

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  Deploy-Preview:
    runs-on: ubuntu-latest
    concurrency:
      group: preview-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v2

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information (Preview)
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts (Preview)
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel (Preview)
        id: deploy
        run: |
          vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} --meta gitCommitAuthorName="Trae Bot" --meta gitCommitMessage="Preview deployment" --json > deployment.json
          echo "url=$(jq -r '.url' deployment.json)" >> $GITHUB_OUTPUT

      - name: Comment Preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = process.env.PREVIEW_URL || '${{ steps.deploy.outputs.url }}'
            const body = `✅ Preview desplegado:\n\n${url}\n\nSe promoverá a producción automáticamente al hacer merge si los checks pasan.`
            const { owner, repo, number } = context.issue
            await github.rest.issues.createComment({ owner, repo, issue_number: number, body })
